name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk rusuden.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rusuden-apk
          path: rusuden.apk

      - name: Publish APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "留守番電話アプリ APK (最新ビルド)"
          body: |
            rusuden.apk をスマホでダウンロードしてインストールしてください。
            (「提供元不明のアプリ」のインストール許可が必要です)
          prerelease: false
          files: rusuden.apk
